<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Croissant+One&family=Hind+Siliguri:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Nunito:wght@500;700&family=Open+Sans:wght@400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
<title>460 Vocabulary Practice</title>
<style>
    :root{
        --bg:#092635;
        --panel:#0f3245;
        --panel-2:#123a52;
        --accent:#FF6868;
        --accent-2:#73B4E9;
        --text:#eef4f8;
        --muted:#9fb7c6;
        --chip:#154a63;
    }
    *{box-sizing:border-box;}
    body{
        font-family:'Open Sans',sans-serif;
        background:radial-gradient(circle at top, #0f3d54, var(--bg) 60%);
        margin:0;
        padding:24px 14px 60px;
        min-height:100vh;
        color:var(--text);
        display:flex;
        justify-content:center;
    }
    body.night-mode{
        --bg:#040404;
        --panel:#151515;
        --panel-2:#1c1c1c;
        --text:#eaeaea;
        --muted:#8a8a8a;
        --chip:#2a2a2a;
        background:var(--bg);
    }
    .container{
        width:100%;
        max-width:720px;
        background:var(--panel);
        border-radius:16px;
        box-shadow:0 10px 40px rgba(0,0,0,.35);
        padding:22px 18px 30px;
        position:relative;
    }
    #buttonWrapper{
        display:flex;
        justify-content:flex-end;
        gap:8px;
        margin-bottom:6px;
    }
    #copyButton,#nightModeButton{
        font-size:13px;
        padding:7px 12px;
        border:none;
        border-radius:20px;
        cursor:pointer;
        background:var(--chip);
        color:var(--text);
        font-family:'Nunito',sans-serif;
        font-weight:700;
        transition:transform .15s ease;
    }
    #copyButton:hover,#nightModeButton:hover{transform:translateY(-1px);}

    h1{
        text-align:center;
        font-family:'Croissant One',sans-serif;
        font-size:2.4em;
        margin:6px 0 22px;
        color:var(--text);
    }
    h1 .hi{color:var(--accent);}

    form{
        background:var(--panel-2);
        border-radius:14px;
        padding:18px;
        text-align:center;
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
    }
    label{
        font-family:'Nunito',sans-serif;
        font-size:15px;
        color:var(--muted);
        display:block;
        margin-bottom:10px;
    }
    input[type="text"]{
        padding:10px 12px;
        margin-bottom:10px;
        border:1px solid #2c5a72;
        border-radius:8px;
        background:#fff;
        width:70%;
        max-width:280px;
        font-family:'JetBrains Mono',monospace;
    }
    input[type="text"]:focus{
        outline:none;
        border-color:var(--accent-2);
        box-shadow:0 0 6px rgba(115,180,233,.7);
    }
    #generateButton{
        display:block;
        margin:6px auto 0;
        padding:10px 26px;
        border:none;
        border-radius:24px;
        background:var(--accent);
        color:#fff;
        font-family:'Nunito',sans-serif;
        font-weight:700;
        font-size:15px;
        cursor:pointer;
        transition:transform .15s ease;
    }
    #generateButton:hover{transform:translateY(-1px);}

    #resultContainer{
        margin-top:20px;
        text-align:center;
    }
    .generated-word{
        margin:4px;
        padding:8px 12px;
        background:var(--chip);
        border-radius:8px;
        display:inline-block;
        cursor:pointer;
        font-family:'Nunito',sans-serif;
        font-weight:600;
        font-size:15px;
        transition:background .15s ease, transform .15s ease;
    }
    .generated-word:hover{transform:translateY(-1px);}
    .generated-word.clicked{
        background:var(--accent);
        color:#fff;
    }

    /* --- Word detail card --- */
    .detail-card{
        display:none;
        margin-top:22px;
        background:var(--panel-2);
        border-radius:14px;
        padding:20px;
        animation:fadeIn .25s ease;
    }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

    .detail-word{
        font-family:'Ubuntu',sans-serif;
        font-size:28px;
        font-weight:700;
        color:var(--accent-2);
        text-transform:capitalize;
        margin-bottom:4px;
    }
    .detail-meaning{
        font-family:'Nunito',sans-serif;
        font-size:16px;
        color:var(--text);
        margin-bottom:12px;
        line-height:1.4;
    }

    .chip-row{
        display:flex;
        flex-wrap:wrap;
        gap:6px;
        margin-bottom:14px;
    }
    .chip{
        font-family:'Hind Siliguri','Nunito',sans-serif;
        font-size:13px;
        padding:5px 10px;
        border-radius:14px;
        background:var(--chip);
        color:var(--muted);
    }
    .chip.bangla{ color:#ffd9a0; font-size:14px; }
    .chip.synonym{ color:#9be3b0; }
    .chip-label{
        font-family:'Nunito',sans-serif;
        font-size:11px;
        text-transform:uppercase;
        letter-spacing:.06em;
        color:var(--muted);
        margin-bottom:5px;
        margin-top:10px;
    }

    /* --- Sentence carousel --- */
    .sentence-box{
        background:rgba(255,255,255,.03);
        border-left:3px solid var(--accent);
        border-radius:6px;
        padding:14px 16px;
        margin-top:6px;
        min-height:60px;
        display:flex;
        align-items:center;
    }
    .sentence-box p{
        font-family:'Nunito',sans-serif;
        font-size:17px;
        line-height:1.5;
        margin:0;
        color:var(--text);
    }
    .sentence-box .kw{ color:var(--accent); font-weight:700; }
    .sentence-nav{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:14px;
        margin-top:10px;
    }
    .sentence-nav button{
        background:var(--chip);
        color:var(--text);
        border:none;
        width:34px;
        height:34px;
        border-radius:50%;
        cursor:pointer;
        font-size:16px;
    }
    .sentence-dots{
        display:flex;
        gap:6px;
    }
    .dot{
        width:7px;
        height:7px;
        border-radius:50%;
        background:var(--chip);
    }
    .dot.active{ background:var(--accent); }

    /* --- Dictionary buttons --- */
    .dict-label{
        font-family:'Nunito',sans-serif;
        font-size:11px;
        text-transform:uppercase;
        letter-spacing:.06em;
        color:var(--muted);
        margin:16px 0 8px;
    }
    .dict-buttons{
        display:flex;
        flex-wrap:wrap;
        gap:8px;
    }
    .dict-buttons button{
        background:#1c5570;
        color:#fff;
        border:none;
        padding:7px 12px;
        border-radius:8px;
        font-size:12.5px;
        cursor:pointer;
        font-family:'Open Sans',sans-serif;
    }
    body.night-mode .dict-buttons button{ background:#2b2b2b; }

    #iframeContainer{
        margin-top:16px;
        display:flex;
        justify-content:center;
    }
    .dictionary-iframe{
        width:100%;
        max-width:700px;
        height:380px;
        border:none;
        border-radius:12px;
        box-shadow:0 4px 16px rgba(0,0,0,.3);
    }
    @media (max-width:768px){
        .dictionary-iframe{ height:300px; max-width:95%; }
    }
    @media (max-width:600px){
        body{ font-size:14px; }
        h1{ font-size:1.9em; }
        .detail-word{ font-size:24px; }
    }

    .sticky-footer{
        position:fixed;
        bottom:0; left:0; width:100%;
        font-size:12px;
        text-align:center;
        padding:6px 0;
        background:rgba(255,255,255,.85);
        color:#555;
        border-top:1px solid #ccc;
        z-index:999;
        backdrop-filter:blur(5px);
    }
    .sticky-footer a{ color:#333; text-decoration:none; }
    .sticky-footer a:hover{ text-decoration:underline; }
</style>
</head>
<body>
    <div class="container">
        <div id="buttonWrapper">
            <button id="copyButton" onclick="copyVocabulary()">Copy</button>
            <button id="nightModeButton" onclick="toggleNightMode()">Mode</button>
        </div>

        <h1><span class="hi">4</span>60 <span class="hi">V</span>ocabulary Practice</h1>

        <form id="vocabularyForm">
            <label for="numberOfWords">How many vocabulary words do you want to practice?</label>
            <input type="text" id="numberOfWords" placeholder="e.g., 10  or  1-15" required>
            <input type="button" value="Generate" id="generateButton" onclick="generateWords()">
        </form>

        <div id="resultContainer"></div>

        <div class="detail-card" id="detailCard">
            <div class="detail-word" id="detailWord"></div>
            <div class="detail-meaning" id="detailMeaning"></div>

            <div class="chip-label">বাংলা অর্থ</div>
            <div class="chip-row" id="banglaChips"></div>

            <div class="chip-label" id="synonymLabel">Synonyms</div>
            <div class="chip-row" id="synonymChips"></div>

            <div class="chip-label">Example</div>
            <div class="sentence-box"><p id="sentenceText"></p></div>
            <div class="sentence-nav">
                <button id="prevSentence" onclick="stepSentence(-1)">&#8249;</button>
                <div class="sentence-dots" id="sentenceDots"></div>
                <button id="nextSentence" onclick="stepSentence(1)">&#8250;</button>
            </div>

            <div class="dict-label">Look up further</div>
            <div class="dict-buttons" id="dictButtons"></div>
            <div id="iframeContainer"></div>
        </div>
    </div>

    <footer class="sticky-footer">
        &copy; 2025 <a href="https://plabonkumersarker.github.io/profile/" target="_blank">Plabon Kumer Sarker</a>
    </footer>

<!-- potato.js must sit in the same folder as this HTML file and define: const vocabList = [ ... ]; -->
<script src="potato.js"></script>
<script>
// ---------------------------------------------------------------
// vocabList now comes from the external potato.js file (loaded via
// <script src="potato.js"> just before this script tag). potato.js
// must define: const vocabList = [ { id, word, meaning,
// bangla_meanings[], sentences[], synonyms[] }, ... ];
// ---------------------------------------------------------------
if (typeof vocabList === "undefined" || !Array.isArray(vocabList) || vocabList.length === 0) {
    alert("Couldn't find vocabList. Make sure potato.js is in the same folder and defines vocabList.");
}

const dictionaries = [
    { name: "Oxford",     url: "https://www.oxfordlearnersdictionaries.com/definition/english/" },
    { name: "Cambridge",  url: "https://dictionary.cambridge.org/dictionary/english/" },
    { name: "Longman",    url: "https://www.ldoceonline.com/dictionary/" },
    { name: "Merriam-Webster", url: "https://www.merriam-webster.com/dictionary/" },
    { name: "Bangla Dictionary", url: "https://www.dictionarybd.com/meaning/", inline: true }
];

let activeItem = null;   // vocab object currently open
let sentenceIndex = 0;

// ---------------- Generate word list ----------------
function generateWords() {
    const inputText = document.getElementById("numberOfWords").value.trim();
    const resultContainer = document.getElementById("resultContainer");
    const rangePattern = /^(\()?(\d+)-(\d+)(\))?$/;
    closeDetailCard();

    let indices = [];

    if (rangePattern.test(inputText)) {
        const match = inputText.match(rangePattern);
        const start = parseInt(match[2]);
        const end = parseInt(match[3]);

        if (!isNaN(start) && !isNaN(end) && start > 0 && end <= vocabList.length && start <= end) {
            for (let i = start; i <= end; i++) indices.push(i - 1);
        } else {
            alert("Invalid range. Please enter a valid range within the vocabulary list length.");
            return;
        }
    } else {
        const numberOfWords = parseInt(inputText);
        if (!isNaN(numberOfWords) && numberOfWords > 0) {
            if (numberOfWords > vocabList.length) {
                alert("Please enter a number less than or equal to the available vocabulary amount.");
                return;
            }
            const uniqueIndices = new Set();
            while (uniqueIndices.size < numberOfWords) {
                uniqueIndices.add(Math.floor(Math.random() * vocabList.length));
            }
            indices = Array.from(uniqueIndices).sort((a, b) => a - b);
        } else {
            alert("Please enter a valid number greater than 0 or a valid range (start-end).");
            return;
        }
    }

    resultContainer.innerHTML = "";
    indices.forEach(i => {
        const item = vocabList[i];
        const wordElement = document.createElement("span");
        wordElement.classList.add("generated-word");
        wordElement.dataset.id = item.id;
        wordElement.textContent = `${i + 1}. ${item.word}`;
        wordElement.addEventListener("click", () => toggleWord(item, wordElement));
        resultContainer.appendChild(wordElement);
    });
}

// ---------------- Word detail card ----------------
function toggleWord(item, element) {
    const isSame = element.classList.contains("clicked");

    document.querySelectorAll(".generated-word").forEach(el => el.classList.remove("clicked"));

    if (isSame) {
        closeDetailCard();
        return;
    }

    element.classList.add("clicked");
    activeItem = item;
    sentenceIndex = 0;
    renderDetailCard(item);
}

function closeDetailCard() {
    activeItem = null;
    document.getElementById("detailCard").style.display = "none";
    document.getElementById("iframeContainer").innerHTML = "";
}

function renderDetailCard(item) {
    const card = document.getElementById("detailCard");
    document.getElementById("detailWord").textContent = item.word;
    document.getElementById("detailMeaning").textContent = item.meaning || "";

    // Bangla meanings
    const banglaChips = document.getElementById("banglaChips");
    banglaChips.innerHTML = "";
    (item.bangla_meanings || []).forEach(b => {
        const chip = document.createElement("span");
        chip.className = "chip bangla";
        chip.textContent = b;
        banglaChips.appendChild(chip);
    });

    // Synonyms
    const synLabel = document.getElementById("synonymLabel");
    const synChips = document.getElementById("synonymChips");
    synChips.innerHTML = "";
    if (item.synonyms && item.synonyms.length) {
        synLabel.style.display = "block";
        item.synonyms.forEach(s => {
            const chip = document.createElement("span");
            chip.className = "chip synonym";
            chip.textContent = s;
            synChips.appendChild(chip);
        });
    } else {
        synLabel.style.display = "none";
    }

    renderSentence();
    renderDots();
    renderDictButtons(item.word);

    document.getElementById("iframeContainer").innerHTML = "";
    card.style.display = "block";
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function renderSentence() {
    if (!activeItem) return;
    const sentences = activeItem.sentences || [];
    const text = sentences[sentenceIndex] || "";
    const highlighted = highlightWord(text, activeItem.word);
    document.getElementById("sentenceText").innerHTML = highlighted;

    const single = sentences.length <= 1;
    document.getElementById("prevSentence").style.visibility = single ? "hidden" : "visible";
    document.getElementById("nextSentence").style.visibility = single ? "hidden" : "visible";
}

function highlightWord(sentence, word) {
    if (!sentence) return "";
    const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(`\\b(${escaped}\\w*)\\b`, "i");
    return sentence.replace(re, `<span class="kw">$1</span>`);
}

function renderDots() {
    const dotsContainer = document.getElementById("sentenceDots");
    dotsContainer.innerHTML = "";
    const sentences = (activeItem && activeItem.sentences) || [];
    sentences.forEach((_, i) => {
        const dot = document.createElement("span");
        dot.className = "dot" + (i === sentenceIndex ? " active" : "");
        dotsContainer.appendChild(dot);
    });
}

function stepSentence(direction) {
    if (!activeItem || !activeItem.sentences || activeItem.sentences.length < 2) return;
    const len = activeItem.sentences.length;
    sentenceIndex = (sentenceIndex + direction + len) % len;
    renderSentence();
    renderDots();
}

// ---------------- Dictionary lookup ----------------
function renderDictButtons(word) {
    const container = document.getElementById("dictButtons");
    container.innerHTML = "";
    dictionaries.forEach(dict => {
        const btn = document.createElement("button");
        btn.textContent = dict.name;
        btn.addEventListener("click", () => {
            if (dict.inline) {
                showDictionaryInIframe(word, dict.url);
            } else {
                window.open(`${dict.url}${word.toLowerCase()}?q=${word.toLowerCase()}`, '_blank');
            }
        });
        container.appendChild(btn);
    });
}

function showDictionaryInIframe(word, dictionaryURL) {
    const iframe = document.createElement('iframe');
    iframe.src = `${dictionaryURL}${word.toLowerCase()}?q=${word.toLowerCase()}`;
    iframe.className = 'dictionary-iframe';
    const iframeContainer = document.getElementById("iframeContainer");
    iframeContainer.innerHTML = '';
    iframeContainer.appendChild(iframe);
}

// ---------------- Utility ----------------
function toggleNightMode() {
    document.body.classList.toggle('night-mode');
}

function copyVocabulary() {
    const resultContainer = document.getElementById("resultContainer");
    const wordsToCopy = Array.from(resultContainer.querySelectorAll(".generated-word"))
        .map(el => el.textContent.replace(/^\d+\.\s*/, ''))
        .join(' ');

    const textarea = document.createElement("textarea");
    textarea.value = wordsToCopy;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    document.body.removeChild(textarea);

    alert("Vocabulary copied to clipboard!");
}
</script>
</body>
</html>
